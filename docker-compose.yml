# DOIT HRM – triển khai bằng Docker Compose.
# Sao chép .env.example thành .env, điền giá trị, rồi: docker compose up -d --build
name: doit-hrm

services:
  db:
    # Ghim bản vá cụ thể (bookworm: cùng glibc với bản 16.4 trước đây, không đổi thứ tự sắp xếp chuỗi/collation).
    image: postgres:16.15-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: hrm
      POSTGRES_USER: hrm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Hãy đặt POSTGRES_PASSWORD trong .env}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hrm -d hrm']
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      pdf:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/hrm
      SPRING_DATASOURCE_USERNAME: hrm
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Hãy đặt POSTGRES_PASSWORD trong .env}
      JHIPSTER_SECURITY_AUTHENTICATION_JWT_BASE64_SECRET: ${JHIPSTER_SECURITY_AUTHENTICATION_JWT_BASE64_SECRET:?Hãy đặt JHIPSTER_SECURITY_AUTHENTICATION_JWT_BASE64_SECRET trong .env}
      STORAGE_ROOT: /data/files
      # Mật khẩu mặc định của tài khoản mới (trống = Doit@2014).
      APPLICATION_ACCOUNT_DEFAULT_PASSWORD: ${APPLICATION_ACCOUNT_DEFAULT_PASSWORD:-}
      # Gửi thư (tùy chọn): link đặt lại mật khẩu qua email. Không cấu hình thì Quản trị dùng "Đặt mật khẩu".
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-localhost}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-25}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:-false}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-false}
      JHIPSTER_MAIL_FROM: ${JHIPSTER_MAIL_FROM:-hrm@localhost}
      JHIPSTER_MAIL_BASE_URL: ${JHIPSTER_MAIL_BASE_URL:-http://localhost:8080}
      BACKUP_STATUS_FILE: /data/backup-status/status.json
      # Dịch vụ chuyển .docx → .pdf (service pdf bên dưới).
      APPLICATION_PDF_URL: http://pdf:3000
      # Thông tin công ty in trên văn bản (xem .env.example).
      APPLICATION_COMPANY_REPRESENTATIVE_NAME: ${APPLICATION_COMPANY_REPRESENTATIVE_NAME:-}
      APPLICATION_COMPANY_REPRESENTATIVE_TITLE: ${APPLICATION_COMPANY_REPRESENTATIVE_TITLE:-Giám đốc}
      APPLICATION_COMPANY_NAME: ${APPLICATION_COMPANY_NAME:-CÔNG TY TNHH CÔNG NGHỆ VÀ TRUYỀN THÔNG DO IT}
    volumes:
      - files:/data/files
      - backup-status:/data/backup-status:ro
    ports:
      - '${APP_BIND:-127.0.0.1:8080}:8080'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8080/management/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  pdf:
    # Gotenberg (LibreOffice qua HTTP) + font Times New Roman; không publish cổng, chỉ app gọi trong mạng compose.
    build: ./ops/pdf
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
    mem_limit: 1g

  backup:
    build: ./ops/backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: Asia/Ho_Chi_Minh
      PGHOST: db
      PGDATABASE: hrm
      PGUSER: hrm
      PGPASSWORD: ${POSTGRES_PASSWORD:?Hãy đặt POSTGRES_PASSWORD trong .env}
      BACKUP_OFFSITE_RSYNC: ${BACKUP_OFFSITE_RSYNC:-}
      # Public key age (age1...) để mã hóa bản đẩy ra ngoài VPS; trống thì không đẩy (status báo lý do).
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_OFFSITE_KEEP: ${BACKUP_OFFSITE_KEEP:-30}
    volumes:
      - files:/data/files:ro
      - backups:/backups
      - backup-status:/data/backup-status
      # Khóa SSH cho rsync ra ngoài VPS, gắn chỉ đọc (xem README).
      - ${BACKUP_SSH_DIR:-./ops/backup/ssh}:/ssh:ro

  caddy:
    image: caddy:2.11.7
    profiles: ['proxy']
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  pgdata:
  files:
  backups:
  backup-status:
  caddy-data:
  caddy-config:
