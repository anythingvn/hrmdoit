---
# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration, like in the JHipsterProperties above
#
# More documentation is available at:
# https://www.jhipster.tech/common-application-properties/
# ===================================================================

application:
  leave:
    # Khởi động xong thì chạy bù việc đầu tháng của sổ phép (cộng phép, chuyển năm, hết hạn) nếu tháng này chưa chạy.
    catch-up-on-startup: true
  account:
    # Mật khẩu mặc định của tài khoản mới (tên đăng nhập = số CCCD); người dùng phải đổi ở lần đăng nhập đầu. Trống = Doit@2014.
    default-password: ${APPLICATION_ACCOUNT_DEFAULT_PASSWORD:Doit@2014}
  storage:
    root: ${STORAGE_ROOT:./data/files}
  backup:
    status-file: ${BACKUP_STATUS_FILE:./data/backup-status/status.json}
  contract:
    term-options-months: [12, 24, 36]
  pdf:
    # Dịch vụ chuyển .docx → .pdf (container pdf trong docker-compose).
    url: ${APPLICATION_PDF_URL:http://localhost:3000}
    timeout-seconds: 60
  company:
    name: ${APPLICATION_COMPANY_NAME:CÔNG TY TNHH CÔNG NGHỆ VÀ TRUYỀN THÔNG DO IT}
    # Người đại diện ký hợp đồng / quyết định (in trên văn bản).
    representative-name: ${APPLICATION_COMPANY_REPRESENTATIVE_NAME:}
    representative-title: ${APPLICATION_COMPANY_REPRESENTATIVE_TITLE:Giám đốc}
